<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ambrosiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B07"/>
      <stop offset="50%" stop-color="#22120C"/>
      <stop offset="100%" stop-color="#2D170E"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#140B07" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <filter id="ambrosiaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#ambrosiaBg)"/>
  <rect width="800" height="500" fill="url(#amberGlow)"/>

  <!-- Botanical Rings & Accent Grid -->
  <g opacity="0.06" stroke="#F59E0B" stroke-width="1">
    <circle cx="400" cy="180" r="160" fill="none"/>
    <circle cx="400" cy="180" r="220" fill="none" stroke-dasharray="8 12"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Stylized Can & Botanical Emblem -->
  <g transform="translate(400, 180)" filter="url(#ambrosiaGlow)">
    <!-- Aura Rings -->
    <circle r="68" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
    <circle r="50" fill="none" stroke="#FDE68A" stroke-width="1" opacity="0.3"/>
    
    <!-- Beverage Can Icon Silhouette -->
    <rect x="-24" y="-38" width="48" height="76" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Top rim -->
    <ellipse cx="0" cy="-38" rx="20" ry="4" fill="none" stroke="#FDE68A" stroke-width="2"/>
    <ellipse cx="0" cy="-34" rx="14" ry="2" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Can accent lines -->
    <path d="M-24,-8 Q0,0 24,-8" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.8"/>
    <path d="M-24,8 Q0,16 24,8" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.8"/>
    <!-- Botanical Leaf Inside -->
    <path d="M0,-16 Q10,-6 0,6 Q-10,-6 0,-16 Z" fill="#FDE68A" opacity="0.9"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="325" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="38" letter-spacing="5" fill="url(#goldText)">AMBROSIA</text>
  <text x="400" y="360" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="2" fill="#F59E0B" opacity="0.9">AI ZERO-SUGAR BEVERAGE LAB · DR. BEV</text>
  
  <!-- Pill Badges -->
  <g transform="translate(400, 405)">
    <rect x="-185" y="-14" width="110" height="28" rx="14" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.3"/>
    <text x="-130" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F59E0B">Next.js 14</text>

    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#FDE68A" fill-opacity="0.12" stroke="#FDE68A" stroke-opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Dr. Bev Copilot</text>

    <rect x="75" y="-14" width="110" height="28" rx="14" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-opacity="0.3"/>
    <text x="130" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Foodtech Lab</text>
  </g>
</svg>
