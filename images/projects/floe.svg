<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B24"/>
      <stop offset="50%" stop-color="#0A0F2E"/>
      <stop offset="100%" stop-color="#0D1235"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00FFA3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060B24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BEEBFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#aurora)"/>

  <!-- Geometric Grid Pattern -->
  <g opacity="0.08" stroke="#00D4FF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Central Hexagonal Frost Crystal -->
  <g transform="translate(400, 190)" filter="url(#glow)">
    <!-- Outer Orbit Circle -->
    <circle r="72" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
    <circle r="52" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.3"/>
    
    <!-- Central Hexagonal Polygon -->
    <polygon points="0,-42 36.37,-21 36.37,21 0,42 -36.37,21 -36.37,-21" fill="none" stroke="url(#crystalGrad)" stroke-width="3"/>
    
    <!-- Crystal Facet Lines -->
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
    <line x1="-36.37" y1="-21" x2="36.37" y2="21" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
    <line x1="-36.37" y1="21" x2="36.37" y2="-21" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Inner Core Diamond -->
    <polygon points="0,-16 14,0 0,16 -14,0" fill="#00D4FF" opacity="0.8"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="325" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="38" letter-spacing="4" fill="url(#textGrad)">FLOE</text>
  <text x="400" y="360" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="2" fill="#00D4FF" opacity="0.9">TRUSTLESS AI AGENT ESCROW · SUI</text>
  
  <!-- Pill Badges -->
  <g transform="translate(400, 405)">
    <rect x="-180" y="-14" width="105" height="28" rx="14" fill="#00D4FF" fill-opacity="0.12" stroke="#00D4FF" stroke-opacity="0.3"/>
    <text x="-127" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#00D4FF">Sui Move</text>

    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#00FFA3" fill-opacity="0.12" stroke="#00FFA3" stroke-opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#00FFA3">Walrus Protocol</text>

    <rect x="75" y="-14" width="105" height="28" rx="14" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.3"/>
    <text x="127" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#B388FF">AI Escrow</text>
  </g>
</svg>
